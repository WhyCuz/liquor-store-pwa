<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquor Store Inventory</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <script defer src="app.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-6">
        <h1 class="text-4xl font-bold text-center mb-6">Liquor Store Inventory</h1>
        
        <!-- Add Item Form -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
            <h2 class="text-2xl font-semibold mb-4">Add New Item</h2>
            <input type="text" id="itemName" placeholder="Item Name" class="w-full p-2 mb-3 rounded-lg bg-gray-700 text-white">
            <input type="text" id="itemDescription" placeholder="Description" class="w-full p-2 mb-3 rounded-lg bg-gray-700 text-white">
            <input type="number" id="itemPrice" placeholder="Price ($)" class="w-full p-2 mb-3 rounded-lg bg-gray-700 text-white">
            <input type="file" id="itemImage" accept="image/*" class="w-full p-2 mb-3 rounded-lg bg-gray-700 text-white">
            <button id="addItem" class="w-full bg-green-500 p-2 rounded-lg font-bold hover:bg-green-600">Add Item</button>
        </div>
        
        <!-- Search Bar -->
        <input type="text" id="searchBar" placeholder="Search Items..." class="w-full p-2 mb-4 rounded-lg bg-gray-700 text-white">
        
        <!-- Item List -->
        <div id="itemList" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Items will be displayed here -->
        </div>
    </div>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('Service Worker Registration Failed', err));
        }
    </script>
</body>
</html>
